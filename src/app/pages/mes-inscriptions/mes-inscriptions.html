<h1>Mes inscriptions</h1>
<p>Bonjour {{ session.nom() }}, vos inscriptions apparaîtront ici.</p>
@if (cours) {
<h1>Inscription : {{ cours.titre }}</h1>
@if (confirmation) {
<p class="succes">{{ confirmation }}</p>
}
<form [formGroup]="form" (ngSubmit)="envoyer()" novalidate>
    <div class="champ">
        <label for="nom">Nom complet</label>
        <input id="nom" formControlName="nom">
    </div>
    <div class="champ">
        <label for="email">Adresse e-mail</label>
        <input id="email" type="email" formControlName="email">
    </div>
    <div class="champ">
        <label for="telephone">Téléphone (facultatif)</label>
        <input id="telephone" formControlName="telephone">
    </div>
    <div class="champ">
        <label for="niveau">Votre niveau</label>
        <select id="niveau" formControlName="niveau">
 <option value="">-- Choisir --</option>
 <option value="debutant">Débutant</option>
 <option value="intermediaire">Intermédiaire</option>
 <option value="avance">Avancé</option>
 </select>
    </div>
    <div class="champ">
        <label for="motivation">Pourquoi ce cours ?</label>
        <textarea id="motivation" rows="4" formControlName="motivation"></textarea>
    </div>
    <div class="champ">
        <label><input type="checkbox" formControlName="conditions"> J'accepte les 
conditions d'inscription</label>
    </div>
    <button type="submit">Valider mon inscription</button>
</form>
} @else {
<p>Ce cours n'existe pas.</p>
}
<a routerLink="/cours">← Retour au catalogue</a>
